<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Alert</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
        <link rel="stylesheet" href="./../../css/alert.css">
    </head>
    <body>
        <div class="page-shell">
            <button class="back">Back</button>

            <div class="main">
                <div class="first">
                    <div class="form-header">
                        <span class="badge">New Alert</span>
                        <h2>Create Alert</h2>
                    </div>

                    <div class="field-group">
                        <p>Select The Target:</p>
                        <select class="input select-input">
                            <option>Gold / USD</option>
                            <option>EUR / USD</option>
                            <option>BTC / USD</option>
                            <option>GBP / USD</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <p>Target Price:</p>
                        <textarea class="target-price input" placeholder="1.2334"></textarea>
                    </div>

                    <div class="field-group">
                        <p>Custom Note:</p>
                        <textarea class="custom-note input" placeholder="good for sell"></textarea>
                    </div>

                    <div class="field-group">
                        <p>Select Channel:</p>
                        <select class="input select-input channel-select">
                            <option>Bale</option>
                            <option selected>Telegram</option>
                            <option>Both</option>
                        </select>
                    </div>

                    <button class="save-btn">Save</button>
                </div>

                <div class="second">
                    <div class="history-head">
                        <p>History</p>
                        <span class="history">0 alerts</span>
                    </div>
                    <div class="realBox"></div>
                </div>
            </div>
        </div>
        <script>
            document.querySelector(".back").addEventListener("click", function () {
                window.location = "./../../main.html";
            });
        </script>
        <script type="module" src="../../js/alert.js"></script>
    </body>
</html>
