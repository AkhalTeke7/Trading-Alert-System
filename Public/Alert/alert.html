<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#010102">
        <title>Alert — Price-Alert</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./../../css/alert.css">
    </head>
    <body>

        <header class="page-head">
            <button class="back" type="button">
                <span aria-hidden="true">←</span> Back
            </button>
            <div class="page-title">
                <h1>Price Alerts</h1>
                <span>Set a target and get notified when it's hit</span>
            </div>
        </header>

        <div class="main">
            <section class="first">
                <div class="field">
                    <label for="future-select">Select The Target</label>
                    <textarea id="future-select" class="input" placeholder="Gold / Eur"></textarea>
                </div>
                <div class="field">
                    <label for="target-price">Target Price</label>
                    <textarea id="target-price" class="input" placeholder="1.2334"></textarea>
                </div>
                <div class="field">
                    <label for="custom-note">Custom Note</label>
                    <textarea id="custom-note" class="input" placeholder="good for sell"></textarea>
                </div>
                <div class="field channels">
                    <label>Channels</label>
                    <div class="channel-group">
                        <button type="button">Bale</button>
                        <button type="button">Telegram</button>
                        <button type="button">Both</button>
                    </div>
                </div>
            </section>

            <section class="second">
                <h2 class="section-title">History</h2>

                <div class="history-box">
                    <button class="close-x" type="button" aria-label="Remove">×</button>
                    <span class="asset">Gold / USD</span>
                    <span class="meta">Target: <b>1.234</b></span>
                    <span class="meta">Note: <b>hi</b></span>
                    <div class="actions">
                        <button type="button">Modify</button>
                        <button type="button" class="is-danger">Delete</button>
                    </div>
                </div>

                <div class="history-box">
                    <button class="close-x" type="button" aria-label="Remove">×</button>
                    <span class="asset">EUR / USD</span>
                    <span class="meta">Target: <b>4.24</b></span>
                    <span class="meta">Note: <b>hi</b></span>
                    <div class="actions">
                        <button type="button">Modify</button>
                        <button type="button" class="is-danger">Delete</button>
                    </div>
                </div>
            </section>
        </div>

        <script>
            document.querySelector(".back").addEventListener("click", function () {
                window.location = "./../../main.html";
            });
        </script>
    </body>
</html>
