<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alert — Trading Alert System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./../../css/alert.css">
    </head>
    <body>
        <div class="main">
            <div class="left">
                <p class="make-a-alert">Create New Alert</p>
                <p class="subtitle">Configure your price notification</p>
                <div class="alert-config">
                    <div class="block-one">
                        <label>Select The Currency:</label>
                        <select>
                            <option>XAU/USD</option>
                            <option>EUR/USD</option>
                            <option>JPY/USD</option>
                            <option>Bitcoin</option>
                        </select>
                    </div>

                    <div class="block-two">
                        <label>Select The Messenger:</label>
                        <select>
                            <option>Telegram</option>
                            <option>WhatsApp</option>
                            <option>Both</option>
                        </select>
                    </div>

                    <div class="block-three">
                        <p>Target Price:</p>
                        <textarea class="input" placeholder="1.2334"></textarea>
                    </div>

                    <div class="block-three">
                        <p>Custom Note:</p>
                        <textarea class="input" placeholder="good for sell"></textarea>
                    </div>

                    <button class="save-button">Save</button>
                </div>
            </div>

            <div class="right">
                <div class="top-right">
                    <div>
                        <p class="alert-history">Alert History</p>
                    </div>
                    <button class="back">Back</button>
                </div>
                <p class="subtitle">Your recent price notifications</p>

                <div class="history-config">
                    <div class="history-box">
                        <p>Target:</p>
                        <p>Gold / EUR</p>
                    </div>
                    <div class="history-box">
                        <p>Price:</p>
                        <p>1.2334</p>
                    </div>
                    <div class="history-box">
                        <p>Channel:</p>
                        <p>Telegram</p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const backButton = document.querySelector(".back");
            if (backButton) {
                backButton.addEventListener("click", function () {
                    window.location = "./../../main.html";
                });
            }
        </script>
    </body>
</html>
