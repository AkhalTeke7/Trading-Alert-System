<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Price-Alert · News</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&family=Noto+Sans+Old+Turkic&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
    <link rel="stylesheet" href="./css/theme.css">
    <script src="./js/theme.js"></script>
    <style>
/* Price-Alert — styled after the ryoku.dev look:
   near-black ground, bone-white type, hairline borders,
   mono "dossier" labels, kanji accents, a single red accent. */

:root {
  --bg: #0a0a0a;
  --panel: #101010;
  --panel-2: #141414;
  --bone: #e9e4d6;
  --muted: #8b877b;
  --dim: #5b584f;
  --red: #d13b2f;
  --line: rgba(233, 228, 214, 0.14);
  --line-strong: rgba(233, 228, 214, 0.38);

  --font-ui: "Inter", system-ui, sans-serif;
  --font-display: "Space Grotesk", "Inter", sans-serif;
  --font-serif: "Fraunces", Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --font-orkhon: "Noto Sans Old Turkic", "Segoe UI Historic", "Noto Sans", sans-serif;

  --header-h: 68px;
  --footer-h: 62px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--bone);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* faint film grain over everything, like the dithered artwork */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  opacity: 0.05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

button:focus-visible {
  outline: 1px solid var(--bone);
  outline-offset: 3px;
}

/* ---------- header ---------- */

.header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.left-header,
.right-header {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-icon {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line-strong);
  color: var(--bone);
  font-size: 13px;
  position: relative;
}

/* tiny red tick on the corner of the mark */
.brand-icon::after {
  content: "";
  position: absolute;
  top: -1px;
  right: -1px;
  width: 6px;
  height: 6px;
  background: var(--red);
}

.brand-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.04em;
}

.divider {
  width: 1px;
  height: 18px;
  background: var(--line);
}

.welcome-text {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.right-header {
  gap: 6px;
}

.paragraph {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 12px;
  border: 1px solid transparent;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.paragraph:hover {
  color: var(--bg);
  background: var(--bone);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: 10px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.status-pill .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}

/* ---------- layout ---------- */

.main {
  display: flex;
  min-height: calc(100vh - var(--header-h) - var(--footer-h));
}

/* ---------- sidebar ---------- */

.sidebar {
  width: 92px;
  flex-shrink: 0;
  background: var(--bg);
  border-right: 1px solid var(--line);
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sid-botton {
  position: relative;
  height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--bone);
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.sid-botton .ico {
  font-size: 18px;
  line-height: 1;
  margin-bottom: 4px;
  color: var(--bone);
  transition: color 0.2s ease;
}

.sid-botton .lb {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color 0.2s ease;
}

.sid-botton:hover {
  background: var(--bone);
  border-color: var(--bone);
  color: var(--bg);
  transform: translateY(-2px);
}

.sid-botton:hover .lb,
.sid-botton:hover .ico {
  color: var(--bg);
}

/* ---------- content ---------- */

.content {
  flex: 1;
  padding: 22px 24px 28px;
  min-width: 0;
}

.section-label {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.tag {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.section-label .rule {
  flex: 1;
  height: 1px;
  background: var(--line);
}

.chart-part {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  height: 48vh;
  min-height: 300px;
  margin-bottom: 16px;
}

/* ---------- cards ---------- */

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 16px 18px 18px;
  background-color: var(--panel);
  /* dithered dot texture, echoing the bone-dithered artwork */
  background-image: radial-gradient(rgba(233, 228, 214, 0.07) 1px, transparent 1px);
  background-size: 7px 7px;
  border: 1px solid var(--line);
  transition: border-color 0.25s ease, transform 0.25s ease, background-color 0.25s ease;
}

/* corner brackets */
.card::before,
.card::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  border-color: var(--bone);
  border-style: solid;
  opacity: 0.55;
  transition: opacity 0.25s ease, border-color 0.25s ease;
}

.card::before {
  top: -1px;
  left: -1px;
  border-width: 1px 0 0 1px;
}

.card::after {
  right: -1px;
  bottom: -1px;
  border-width: 0 1px 1px 0;
}

.card:hover {
  border-color: var(--line-strong);
  background-color: var(--panel-2);
  transform: translateY(-2px);
}

.card:hover::before,
.card:hover::after {
  opacity: 1;
  border-color: var(--red);
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.tag .orkhon {
  font-family: var(--font-orkhon);
  font-size: 15px;
  letter-spacing: 0;
  color: var(--bone);
}

.card .kanji {
  font-family: var(--font-orkhon);
  font-size: 26px;
  line-height: 1;
  color: var(--dim);
  transition: color 0.25s ease;
}

.card:hover .kanji {
  color: var(--red);
}

.card-body h2 {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(32px, 4vw, 52px);
  line-height: 1;
  letter-spacing: -0.01em;
}

.card-body .hint {
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
}

.bottom {
  height: 170px;
}

.bottom .card-body h2 {
  font-size: clamp(26px, 3vw, 36px);
}

/* ---------- footer ---------- */

.footer {
  height: var(--footer-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-top: 1px solid var(--line);
  background: var(--bg);
}

.footer-content {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.footer-content .sep {
  color: var(--dim);
}

.footer-jp {
  font-family: var(--font-orkhon);
  font-size: 16px;
  letter-spacing: 0.2em;
  color: var(--dim);
}

/* ---------- responsive ---------- */

@media (max-width: 760px) {
  .header {
    padding: 0 16px;
  }

  .divider,
  .welcome-text,
  .status-pill {
    display: none;
  }

  .main {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
  }

  .sid-botton {
    flex: 1 1 70px;
    height: 56px;
  }

  .content {
    padding: 18px 16px 24px;
  }

  .chart-part {
    grid-template-columns: 1fr;
    height: auto;
    min-height: 0;
  }

  .card {
    min-height: 170px;
  }

  .footer {
    padding: 0 16px;
  }

  .footer-content {
    gap: 8px;
    font-size: 9px;
  }

  .footer-jp {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

/* news.css — extras for the weekly news page, built on the Price-Alert
   theme tokens in ./css/style.css (--bone, --red, --line, --panel ...). */

/* back button (header) */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--line);
  transition: color .2s ease, background .2s ease, border-color .2s ease;
}
.back-btn:hover { color: var(--bg); background: var(--bone); border-color: var(--bone); }

/* active sidebar item */
.sid-botton.active { border-color: var(--line-strong); }
.sid-botton.active::after {
  content: "";
  position: absolute;
  top: -1px; right: -1px;
  width: 6px; height: 6px;
  background: var(--red);
}

/* cards: these hold lists, so no big lift / smaller headings */
.news-toolbar, .day { justify-content: flex-start; gap: 14px; }
.news-toolbar:hover, .day:hover { transform: none; }
.news-toolbar .card-body h2,
.day .card-body h2 { font-size: clamp(24px, 2.6vw, 34px); }

.toolbar-body {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 16px;
}
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip-group { display: inline-flex; gap: 6px; }

.chip, .select {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 12px;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 0;
  transition: color .2s, background .2s, border-color .2s;
}
.chip:hover, .select:hover { color: var(--bg); background: var(--bone); border-color: var(--bone); }
.chip.active { color: var(--bone); border-color: var(--line-strong); box-shadow: inset 0 -2px 0 var(--red); }
.chip.active:hover { color: var(--bg); }
.select option { background: var(--panel); color: var(--bone); }

/* status */
.status {
  margin-bottom: 16px; padding: 12px 14px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em;
  color: var(--muted); border: 1px dashed var(--line-strong);
}
.status.error { color: var(--red); border-color: var(--red); }

/* days */
#days { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
.day.today { border-color: var(--line-strong); }
.day.today .kanji { color: var(--red); }
.badge {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; padding: 3px 8px; margin-left: 10px;
  color: var(--red); border: 1px solid var(--red); vertical-align: middle;
}

/* event rows */
.ev-list { display: flex; flex-direction: column; margin-top: 14px; }
.ev {
  display: grid;
  grid-template-columns: 96px 10px 64px minmax(0, 1fr) repeat(3, 92px);
  align-items: center; gap: 12px; padding: 10px 4px;
  border-top: 1px solid var(--line);
  font-size: 14px; line-height: 1.35;
}
.ev:first-child { border-top: 0; }
.ev-time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.ev-time { display: flex; flex-direction: column; white-space: nowrap; }
.ev-time small { font-size: 10px; letter-spacing: .08em; color: var(--dim); margin-top: 2px; }
.ev-country { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.ev-title { font-weight: 500; }
.rel {
  display: inline-block; margin-right: 8px; padding: 2px 6px;
  font-family: var(--font-mono); font-size: 9px; font-weight: 400;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line-strong);
  vertical-align: middle;
}
.ev:has(.rel) .ev-title { color: var(--muted); }
.ev-title em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: 6px; }
.ev-num { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.ev-num small { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }

.ev-dot { width: 8px; height: 8px; background: var(--dim); }
.imp-mid .ev-dot { background: var(--muted); }
.imp-high .ev-dot { background: var(--red); box-shadow: 0 0 0 3px rgba(209, 59, 47, .25); }

code { font-family: var(--font-mono); color: var(--bone); }

@media (max-width: 760px) {
  .ev { grid-template-columns: repeat(3, 1fr); row-gap: 6px; }
  .ev-time    { grid-column: 1; grid-row: 1; }
  .ev-dot     { display: none; }
  .ev-country { grid-column: 3; grid-row: 1; justify-self: end; }
  .ev-title   { grid-column: 1 / -1; grid-row: 2; }
  .ev-num     { align-items: flex-start; grid-row: 3; }
}

    </style>
</head>
<body>

    <header class="header">
        <button type="button" class="back-btn" id="backBtn" aria-label="Back">
            <i class="ti ti-arrow-left"></i><span>Back</span>
        </button>
    </header>

    <div class="main">

        <div class="content">

            <div class="section-label">
                <span class="tag"><span class="orkhon">𐱅</span> · Weekly Events</span>
                <span class="rule"></span>
            </div>

            <section class="card news-toolbar">
                <div class="card-head">
                    <span class="tag">01 // WEEK</span>
                    <span class="kanji">𐰀</span>
                </div>
                <div class="card-body toolbar-body">
                    <div class="week-range">
                        <h2 id="weekTitle">This week</h2>
                        <p class="hint" id="weekSub">loading…</p>
                    </div>

                    <div class="filters">
                        <div class="chip-group" id="impFilter" role="group" aria-label="Importance">
                            <button type="button" class="chip active" data-imp="all">All</button>
                            <button type="button" class="chip" data-imp="1">High</button>
                            <button type="button" class="chip" data-imp="0">Medium+</button>
                        </div>
                        <select id="countryFilter" class="select" aria-label="Country">
                            <option value="all">All countries</option>
                        </select>
                        <button type="button" class="chip" id="refreshBtn" title="Reload"><i class="ti ti-refresh"></i></button>
                    </div>
                </div>
            </section>

            <div id="status" class="status" hidden></div>

            <div id="days"></div>

        </div>

    </div>

    <footer class="footer">
        <div class="footer-content">
            <span>Market Pulse</span>
            <span class="sep">/</span>
            <span>Alerts</span>
            <span class="sep">/</span>
            <span>Live Data</span>
        </div>
        <span class="footer-jp">𐰀 𐰴 𐰚 𐰀 𐰠 . 𐱅 𐰀 𐰚 𐰀</span>
    </footer>

<script src="./js/news.js"></script>

</body>
</html>
