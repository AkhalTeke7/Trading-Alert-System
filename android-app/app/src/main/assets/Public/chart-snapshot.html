<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;overflow:hidden}
  #wrap{width:1200px;height:675px;display:flex}
  .tradingview-widget-container{flex:1}
  .tradingview-widget-container iframe{border:0}
</style>
</head>
<body>
<div id="wrap">
  <div class="tradingview-widget-container" id="tv">
    <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
  </div>
</div>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const symbol = p.get('symbol') || 'OANDA:XAUUSD';
  const interval = p.get('interval') || '15';
  const s = document.createElement('script');
  s.type = 'text/javascript';
  s.async = true;
  s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
  s.textContent = JSON.stringify({
    autosize: true,
    symbol: symbol,
    interval: interval,
    timezone: 'Etc/UTC',
    theme: 'dark',
    style: '1',
    locale: 'en',
    enable_publishing: false,
    backgroundColor: 'rgba(10, 10, 10, 1)',
    gridColor: 'rgba(233, 228, 214, 0.06)',
    overrides: {
      'mainSeriesProperties.candleStyle.upColor': '#16a34a',
      'mainSeriesProperties.candleStyle.downColor': '#0a0a0a',
      'mainSeriesProperties.candleStyle.borderUpColor': '#16a34a',
      'mainSeriesProperties.candleStyle.borderDownColor': '#555555',
      'mainSeriesProperties.candleStyle.wickUpColor': '#16a34a',
      'mainSeriesProperties.candleStyle.wickDownColor': '#555555',
      'mainSeriesProperties.candleStyle.borderColor': '#555555'
    },
    hide_top_toolbar: false,
    hide_side_toolbar: true,
    allow_symbol_change: false,
    save_image: false,
    calendar: false,
    support_host: 'https://www.tradingview.com'
  });
  document.getElementById('tv').appendChild(s);
})();
</script>
</body>
</html>
